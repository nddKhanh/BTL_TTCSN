<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Mộc Nhiên Coffee</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-card {
      max-width: 440px;
      margin: 50px auto;
      background: #fff;
      padding: 36px 30px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }
    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-red);
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-error {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--primary-red);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-section">
        <div class="logo-icon">H</div>
        <span class="brand-name">Mộc Nhiên Coffee</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Menu</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="auth-card">
      <h2 class="auth-title">Đăng Nhập Tài Khoản</h2>
      
      <div id="authError" class="auth-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nhanvien@mocnhien.vn hoặc customer@mocnhien.vn" required>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Mộc Nhiên Coffee Project - Bài tập môn TTCSN</p>
  </footer>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('authError');
      errorDiv.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();

        if (result.success && result.data) {
          setAuth(result.data.token, result.data.user);
          alert(`Đăng nhập thành công! Chào mừng ${result.data.user.fullName}`);
          if (result.data.user.role === 'ADMIN') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          errorDiv.textContent = result.message || 'Đăng nhập thất bại!';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = err.message || 'Không thể kết nối đến máy chủ!';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
