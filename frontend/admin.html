<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Trị Hệ Thống - Mộc Nhiên Coffee Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modal.css">
  <style>
    .admin-nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }
    .tab-btn {
      background: #fff;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px 8px 0 0;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-dark);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary-red);
      color: #fff;
      border-color: var(--primary-red);
    }
    .admin-section {
      display: none;
    }
    .admin-section.active {
      display: block;
    }
    .admin-table-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .admin-table th {
      background: var(--primary-red);
      color: #fff;
      padding: 12px;
    }
    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .badge-active {
      background: #d4edda;
      color: #155724;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-hidden {
      background: #e2e3e5;
      color: #383d41;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .action-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-right: 4px;
    }
    .btn-edit { background: #ffc107; color: #212529; }
    .btn-danger { background: #dc3545; color: #fff; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-section">
        <div class="logo-icon">H</div>
        <span class="brand-name">Mộc Nhiên Coffee Admin</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">← Xem Trang Chủ / Menu</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:1150px; margin-top:24px;">

    <!-- Navigation Tabs -->
    <div class="admin-nav-tabs">
      <button class="tab-btn active" onclick="switchTab('ordersTab', this)">📦 Quản Lý Đơn Hàng</button>
      <button class="tab-btn" onclick="switchTab('productsTab', this)">☕ Quản Lý Sản Phẩm</button>
      <button class="tab-btn" onclick="switchTab('categoriesTab', this)">📁 Quản Lý Danh Mục</button>
      <button class="tab-btn" onclick="switchTab('toppingsTab', this)">🧋 Quản Lý Topping</button>
    </div>

    <!-- Section 1: Orders -->
    <div id="ordersTab" class="admin-section active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3>Danh Sách Đơn Hàng</h3>
        <button onclick="loadAdminOrders()" class="btn-add">🔄 Làm mới</button>
      </div>
      <div id="adminOrdersList" class="admin-table-card">
        <p style="padding:20px;">Đang tải danh sách đơn hàng...</p>
      </div>
    </div>

    <!-- Section 2: Products -->
    <div id="productsTab" class="admin-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3>Danh Sách Sản Phẩm</h3>
        <button onclick="openProductModal()" class="btn-add">+ Thêm Món Mới</button>
      </div>
      <div id="adminProductsList" class="admin-table-card">
        <p style="padding:20px;">Đang tải sản phẩm...</p>
      </div>
    </div>

    <!-- Section 3: Categories -->
    <div id="categoriesTab" class="admin-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3>Danh Sách Danh Mục</h3>
        <button onclick="openCategoryModal()" class="btn-add">+ Thêm Danh Mục</button>
      </div>
      <div id="adminCategoriesList" class="admin-table-card">
        <p style="padding:20px;">Đang tải danh mục...</p>
      </div>
    </div>

    <!-- Section 4: Toppings -->
    <div id="toppingsTab" class="admin-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3>Danh Sách Topping</h3>
        <button onclick="openToppingModal()" class="btn-add">+ Thêm Topping</button>
      </div>
      <div id="adminToppingsList" class="admin-table-card">
        <p style="padding:20px;">Đang tải topping...</p>
      </div>
    </div>

  </main>

  <!-- Modal Product Form -->
  <div class="modal-overlay" id="productFormModal">
    <div class="modal-card" style="max-width:520px;">
      <div class="modal-header">
        <span class="modal-title" id="productModalTitle">Thêm Sản Phẩm</span>
        <button class="modal-close" onclick="closeAdminModal('productFormModal')">&times;</button>
      </div>
      <form id="productForm" style="padding:20px;">
        <input type="hidden" id="prodId">
        <div class="form-group">
          <label>Tên Sản Phẩm *</label>
          <input type="text" id="prodName" required placeholder="Nhập tên món">
        </div>
        <div class="form-group">
          <label>Danh Mục *</label>
          <select id="prodCategory" required></select>
        </div>
        <div class="form-group">
          <label>Giá Gốc (VNĐ) *</label>
          <input type="number" id="prodPrice" required min="0" step="1000" placeholder="45000">
        </div>
        <div class="form-group">
          <label>URL Hình Ảnh</label>
          <input type="url" id="prodImage" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>Mô Tả</label>
          <textarea id="prodDesc" rows="3" placeholder="Mô tả đồ uống..."></textarea>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="prodActive" checked style="width:auto;">
          <label for="prodActive" style="margin:0; cursor:pointer;">Hiển thị bán trên Menu</label>
        </div>
        <button type="submit" class="btn-submit">Lưu Sản Phẩm</button>
      </form>
    </div>
  </div>

  <!-- Modal Category Form -->
  <div class="modal-overlay" id="categoryFormModal">
    <div class="modal-card" style="max-width:440px;">
      <div class="modal-header">
        <span class="modal-title" id="categoryModalTitle">Thêm Danh Mục</span>
        <button class="modal-close" onclick="closeAdminModal('categoryFormModal')">&times;</button>
      </div>
      <form id="categoryForm" style="padding:20px;">
        <input type="hidden" id="catId">
        <div class="form-group">
          <label>Mã Danh Mục (Code) *</label>
          <input type="text" id="catCode" required placeholder="COFFEE, TEA...">
        </div>
        <div class="form-group">
          <label>Tên Danh Mục *</label>
          <input type="text" id="catName" required placeholder="Cà Phê, Trà...">
        </div>
        <div class="form-group">
          <label>URL Hình Ảnh Banner</label>
          <input type="url" id="catImage" placeholder="https://example.com/banner.jpg">
        </div>
        <button type="submit" class="btn-submit">Lưu Danh Mục</button>
      </form>
    </div>
  </div>

  <!-- Modal Topping Form -->
  <div class="modal-overlay" id="toppingFormModal">
    <div class="modal-card" style="max-width:420px;">
      <div class="modal-header">
        <span class="modal-title" id="toppingModalTitle">Thêm Topping</span>
        <button class="modal-close" onclick="closeAdminModal('toppingFormModal')">&times;</button>
      </div>
      <form id="toppingForm" style="padding:20px;">
        <input type="hidden" id="topId">
        <div class="form-group">
          <label>Tên Topping *</label>
          <input type="text" id="topName" required placeholder="Thạch Đào, Kem Cheese...">
        </div>
        <div class="form-group">
          <label>Giá Topping (VNĐ) *</label>
          <input type="number" id="topPrice" required min="0" step="1000" placeholder="10000">
        </div>
        <button type="submit" class="btn-submit">Lưu Topping</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
