services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: highlands
      MYSQL_USER: highlands
      MYSQL_PASSWORD: highlands
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/highlands
      DB_USERNAME: highlands
      DB_PASSWORD: highlands
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
